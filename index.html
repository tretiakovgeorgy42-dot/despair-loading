<!doctype html>
<!--
  Despair Syndrome loading screen (owner, 2026-10-25): the owner's picture "ИДУТ РАБОТЫ"
  (bg.jpg, 1920x1080) over the whole screen and a thin loading bar under its text. Replaces
  the terminal design "despair-loading-1a" (in git history). Hosted on GitHub Pages as
  sv_loadingurl; Garry's Mod calls GameDetails, SetFilesTotal, SetFilesNeeded,
  DownloadingFile and SetStatusChanged while the player connects, and the bar follows the
  real download. Opened in a browser, it plays a demo progress. Plain ES5: the game's old
  browser shows it.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despair Syndrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root { --green: #3ee05a; --pink: #ff4fa3; --white: #f4f4f4; --dim: #3a3a3a; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
/* The picture's own 1920x1080 frame, scaled to fit the screen whole, black around it (fit() below). */
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px;
  background: #000 url("bg.jpg") no-repeat 0 0; background-size: 1920px 1080px; transform-origin: center; }
/* The bar sits under "Приятной игры!", on the picture's text column (x 645). */
.load { position: absolute; left: 645px; top: 784px; width: 1000px; height: 22px;
  font: 16px/22px "Press Start 2P", monospace; color: var(--white); }
.track { position: absolute; left: 0; top: 4px; width: 820px; height: 14px; border: 2px solid var(--white);
  box-sizing: border-box; background: #000; }
.fill { height: 100%; width: 0; background: var(--green); }
.pct { position: absolute; left: 840px; top: 0; }
.status { position: absolute; left: 0; top: 26px; width: 1000px; font-size: 10px; line-height: 14px; color: #9a9a9a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done .fill { background: var(--pink); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="load" id="load">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="pct" id="pct">0%</span>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
function $(id) { return document.getElementById(id); }

// Garry's Mod's loading screen calls (the files the player still downloads).
var game = { total: 0, needed: 0, status: '', file: '', real: false };
window.GameDetails = function () { game.real = true; };
window.SetFilesTotal = function (total) { game.real = true; game.total = Number(total) || 0; };
window.SetFilesNeeded = function (needed) { game.real = true; game.needed = Number(needed) || 0; };
window.DownloadingFile = function (file) { game.real = true; game.file = String(file || ''); };
window.SetStatusChanged = function (status) { game.real = true; game.status = String(status || ''); };

var t = 0, shown = 0;
function progress() {
  if (game.real) {
    // The real download; without files to fetch it creeps to 95 % until the game takes over.
    var real = game.total > 0 ? (1 - game.needed / game.total) * 100 : Math.min(95, t * 0.4);
    shown = Math.max(shown, Math.min(99, Math.floor(real)));
    return shown;
  }
  return Math.min(100, Math.floor((t * 0.8) % 140)); // a demo in a browser
}

function render() {
  var p = progress();
  $('fill').style.width = p + '%';
  $('pct').textContent = p + '%';
  $('load').className = p >= 100 ? 'load done' : 'load';
  $('status').textContent = game.file || game.status || '';
}

function fit() {
  $('stage').style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')';
}
addEventListener('resize', fit);
fit();
render();
setInterval(function () { t++; render(); }, 100);
</script>
</body>
</html>
